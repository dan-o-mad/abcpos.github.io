<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABC POS — The Till</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --ink:#141B2D; --teal:#0E7C6B; --amber:#F2A93B; --paper:#F6F4EF;
  --line:#E6E1D5; --danger:#D4483B; --muted:#8A93AC;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Sora',system-ui,sans-serif; background:#22293D; min-height:100vh;
  display:flex; flex-direction:column; align-items:center; gap:13px; padding:22px 12px 34px;
}
.caption{color:#8A93AC; font-size:11.5px; font-weight:600; letter-spacing:.06em; text-align:center}
.caption a{color:var(--amber); text-decoration:none}
.fig{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums}

/* ---------- tablet frame ---------- */
.tablet{
  width:min(1020px,97vw); aspect-ratio:16/10; background:#0A0D16; border-radius:26px;
  padding:13px; box-shadow:0 34px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.05);
  position:relative;
}
.tablet::after{
  content:''; position:absolute; right:5px; top:50%; transform:translateY(-50%);
  width:3px; height:52px; background:#1B2233; border-radius:3px;
}
.screen{
  width:100%; height:100%; background:var(--paper); border-radius:15px;
  overflow:hidden; display:flex; flex-direction:column; position:relative;
}

/* ---------- top bar ---------- */
.bar{display:flex; align-items:center; gap:10px; padding:0 14px; height:50px; background:var(--ink); flex-shrink:0}
.brand{font-weight:800; color:#fff; font-size:15.5px; letter-spacing:-.01em}
.brand span{color:var(--amber)}
.mode{display:flex; background:rgba(255,255,255,.08); border-radius:9px; padding:3px; gap:2px; margin-left:4px}
.mode button{
  border:none; background:none; cursor:pointer; font-family:inherit; color:#9AA3B8;
  font-size:11.5px; font-weight:700; padding:5px 11px; border-radius:7px;
  display:flex; align-items:center; gap:6px; transition:background .15s,color .15s;
}
.mode button.on{background:var(--amber); color:var(--ink)}
.mode button i{font-size:10px}
.bar .sp{flex:1}
.qbadge{display:flex; align-items:center; gap:6px; background:rgba(242,169,59,.18); color:var(--amber); font-size:11px; font-weight:700; padding:5px 11px; border-radius:16px}
.net{
  display:flex; align-items:center; gap:7px; border:none; cursor:pointer; font-family:inherit;
  background:var(--teal); color:#fff; font-size:10px; font-weight:800; letter-spacing:.1em;
  padding:7px 13px; border-radius:16px; transition:background .2s;
}
.net.off{background:var(--danger)}
.net i.dot{width:6px; height:6px; border-radius:50%; background:#fff; display:block}
.net.off i.dot{animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.iconbtn{border:none; background:rgba(255,255,255,.08); color:#fff; cursor:pointer; width:31px; height:31px; border-radius:9px; font-size:13px}
.iconbtn:hover{background:rgba(255,255,255,.16)}

/* ---------- body ---------- */
.body{flex:1; display:flex; min-height:0}
.left{flex:1; display:flex; flex-direction:column; min-width:0}

.tools{display:flex; gap:8px; padding:11px 13px 0; flex-shrink:0}
.srch{position:relative; flex:1; min-width:0}
.srch > i{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:12px}
.srch input{
  width:100%; font-family:inherit; font-size:13px; padding:9px 30px 9px 32px;
  border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);
}
.srch input:focus{outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(14,124,107,.13)}
.srch .clr{position:absolute; right:7px; top:50%; transform:translateY(-50%); border:none; background:none; cursor:pointer; color:var(--muted); font-size:12px; padding:4px; display:none}
.srch .clr.show{display:block}
.scan{position:relative; width:196px; flex-shrink:0}
.scan i{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--amber); font-size:13px}
.scan input{
  width:100%; font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:.04em;
  padding:9px 10px 9px 31px; border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);
}
.scan input:focus{outline:none; border-color:var(--amber); box-shadow:0 0 0 3px rgba(242,169,59,.16)}
.kbd{font-family:'IBM Plex Mono',monospace; font-size:9.5px; background:#fff; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:1px 4px; color:var(--muted)}

.cats{display:flex; gap:6px; padding:10px 13px; overflow-x:auto; scrollbar-width:none; flex-shrink:0}
.cats::-webkit-scrollbar{display:none}
.cat{
  border:1.5px solid var(--line); background:#fff; cursor:pointer; font-family:inherit;
  font-size:12px; font-weight:700; color:var(--ink); padding:6px 13px; border-radius:16px;
  white-space:nowrap; transition:background .15s,color .15s,border-color .15s;
}
.cat.on{background:var(--ink); color:#fff; border-color:var(--ink)}

.tiles{flex:1; overflow-y:auto; padding:0 13px 13px; display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:8px; align-content:start}
.tile{
  border:1.5px solid var(--line); background:#fff; cursor:pointer; font-family:inherit;
  border-radius:11px; padding:10px; text-align:left; min-height:76px; position:relative;
  display:flex; flex-direction:column; justify-content:space-between;
  transition:transform .1s, border-color .15s, box-shadow .15s;
}
.tile:hover{border-color:var(--teal); box-shadow:0 2px 8px rgba(20,27,45,.08)}
.tile:active{transform:scale(.96)}
.tile .n{font-size:12px; font-weight:700; line-height:1.3; color:var(--ink)}
.tile .sub{font-size:10px; color:var(--muted); margin-top:1px}
.tile .p{font-size:12.5px; font-weight:800; color:var(--teal); margin-top:7px}
.tile .p small{font-weight:600; color:var(--muted); font-size:9.5px}
.tile .stk{position:absolute; top:7px; right:7px; font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:600; padding:1.5px 5px; border-radius:8px}
.stk.ok{background:rgba(14,124,107,.12); color:var(--teal)}
.stk.low{background:rgba(242,169,59,.2); color:#946012}
.stk.out{background:rgba(212,72,59,.13); color:var(--danger)}
.tile.out{opacity:.45; cursor:not-allowed}
.tile .scale{position:absolute; right:9px; bottom:9px; color:var(--amber); font-size:10px}
.tile mark{background:rgba(242,169,59,.45); color:inherit; border-radius:2px; padding:0 1px}
.none{grid-column:1/-1; text-align:center; padding:34px 16px; color:var(--muted)}
.none i{font-size:24px; display:block; margin-bottom:9px; opacity:.4}
.none p{font-size:12.5px}

/* ---------- cart ---------- */
.cart{width:296px; flex-shrink:0; background:#fff; border-left:1.5px solid var(--line); display:flex; flex-direction:column}
.chead{padding:11px 13px; border-bottom:1.5px solid var(--line)}
.seg{display:flex; gap:4px}
.seg button{flex:1; border:none; cursor:pointer; font-family:inherit; font-size:10px; font-weight:800; padding:7px 0; border-radius:8px; background:var(--paper); color:var(--ink); transition:background .15s,color .15s}
.seg button.on{background:var(--teal); color:#fff}
.tbls{display:flex; flex-wrap:wrap; gap:4px; margin-top:7px}
.tbls button{border:none; cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; padding:4px 9px; border-radius:7px; background:var(--paper); color:var(--ink)}
.tbls button.on{background:var(--amber)}
.lines{flex:1; overflow-y:auto; padding:4px 13px}
.line{display:flex; align-items:center; gap:7px; padding:8px 0; border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:none}
.line .nm{flex:1; min-width:0}
.line .nm b{font-size:12px; font-weight:700; display:block; color:var(--ink); line-height:1.3}
.line .nm span{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted)}
.q{display:flex; align-items:center; gap:2px}
.q button{width:23px; height:23px; border:none; cursor:pointer; border-radius:7px; font-size:10px; display:grid; place-items:center}
.q .m{background:var(--paper); color:var(--ink)}
.q .p{background:var(--teal); color:#fff}
.q span{width:24px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600}
.line .lt{font-family:'IBM Plex Mono',monospace; font-size:12px; width:56px; text-align:right; color:var(--ink)}
.empty{text-align:center; padding:40px 14px; color:var(--muted)}
.empty i{font-size:25px; display:block; margin-bottom:10px; opacity:.35}
.empty p{font-size:12px}
.sums{padding:10px 13px; border-top:1.5px solid var(--line); background:var(--paper)}
.sr{display:flex; justify-content:space-between; font-size:11.5px; padding:2px 0; color:var(--ink)}
.sr.tot{font-size:16px; font-weight:800; padding-top:7px; margin-top:5px; border-top:1px solid var(--line)}
.sr.tot .fig{color:var(--teal)}
.drow{display:flex; align-items:center; gap:8px; font-size:11.5px; padding:3px 0; color:var(--ink)}
.drow input{flex:1; accent-color:var(--amber)}
.charge{
  margin:9px 13px 12px; padding:13px; border:none; cursor:pointer; font-family:inherit;
  border-radius:11px; background:var(--teal); color:#fff; font-size:13.5px; font-weight:800;
  display:flex; align-items:center; justify-content:center; gap:9px; transition:background .15s;
}
.charge:hover:not(:disabled){background:#0C6B5C}
.charge:disabled{background:#B9C0CF; cursor:not-allowed}

/* ---------- overlays ---------- */
.veil{position:absolute; inset:0; background:rgba(20,27,45,.55); display:none; place-items:center; z-index:40; padding:18px}
.veil.open{display:grid}
.modal{background:#fff; border-radius:16px; padding:18px; width:min(320px,100%)}
.modal h3{font-size:14.5px; font-weight:800; color:var(--ink)}
.big{font-size:27px; font-weight:800; color:var(--teal); margin:5px 0 13px}
.fld{margin-top:11px}
.fld label{font-size:11px; font-weight:700; color:#5B6478; display:block; margin-bottom:4px}
.fld input{width:100%; font-family:'IBM Plex Mono',monospace; font-size:15px; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; background:var(--paper); color:var(--ink)}
.fld input:focus{outline:none; border-color:var(--teal)}
.quick{display:flex; gap:5px; margin-top:6px}
.quick button{flex:1; border:1.5px solid var(--line); background:#fff; cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:12px; padding:7px 0; border-radius:8px; color:var(--ink)}
.quick button:hover{border-color:var(--amber); background:rgba(242,169,59,.1)}
.acts{display:flex; gap:7px; margin-top:15px}
.acts button{flex:1; border:none; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:800; padding:11px; border-radius:10px}
.gh{background:var(--paper); color:var(--ink)}
.go{background:var(--teal); color:#fff}
.go:disabled{opacity:.4; cursor:not-allowed}
.amb{background:var(--amber); color:var(--ink)}

.receipt{
  width:224px; background:#fff; color:#111; padding:15px 13px 20px;
  font-family:'IBM Plex Mono',monospace; font-size:10px; line-height:1.62;
  box-shadow:0 14px 34px rgba(0,0,0,.35);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),95% 100%,90% calc(100% - 6px),85% 100%,
    80% calc(100% - 6px),75% 100%,70% calc(100% - 6px),65% 100%,60% calc(100% - 6px),55% 100%,
    50% calc(100% - 6px),45% 100%,40% calc(100% - 6px),35% 100%,30% calc(100% - 6px),25% 100%,
    20% calc(100% - 6px),15% 100%,10% calc(100% - 6px),5% 100%,0 calc(100% - 6px));
}
.receipt .c{text-align:center}
.receipt .b{font-family:'Sora',sans-serif; font-weight:800; font-size:12px}
.receipt .r{display:flex; justify-content:space-between; gap:8px}
.receipt .hr{border-top:1px dashed #BDB49F; margin:7px 0}
.receipt .qr{width:44px; height:44px; margin:9px auto 0; border:3px solid #111; background:repeating-conic-gradient(#111 0% 25%,#fff 0% 50%); background-size:7px 7px}
.receipt .mu{color:#8A7C63}

.drawer{
  position:absolute; top:0; right:0; bottom:0; width:min(330px,86%); background:var(--paper);
  border-left:1.5px solid var(--line); transform:translateX(101%);
  transition:transform .26s cubic-bezier(.22,1,.36,1); z-index:45; display:flex; flex-direction:column;
}
.drawer.open{transform:none}
.dhead{display:flex; align-items:center; gap:9px; padding:13px; border-bottom:1.5px solid var(--line)}
.dhead h3{font-size:13.5px; font-weight:800; color:var(--ink); flex:1}
.dbody{flex:1; overflow-y:auto; padding:11px 13px 20px}
.oc{background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:9px 11px; display:flex; align-items:center; gap:8px; margin-bottom:6px}
.oc b{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink)}
.oc .mt{font-size:10px; color:var(--muted); flex:1}
.tag{font-size:9px; font-weight:800; padding:2.5px 7px; border-radius:10px}
.tag.s{background:rgba(14,124,107,.13); color:var(--teal)}
.tag.p{background:rgba(242,169,59,.22); color:#946012}

.toast{
  position:absolute; left:50%; bottom:16px; transform:translateX(-50%) translateY(60px);
  background:var(--ink); color:#fff; font-size:11.5px; font-weight:600; padding:9px 16px;
  border-radius:9px; z-index:60; transition:transform .24s; white-space:nowrap; max-width:90%;
}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:820px){
  .tablet{aspect-ratio:auto; height:90vh}
  .cart{width:240px}
  .scan{width:150px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="caption">ABC POS — THE TILL · INTERACTIVE DEMO</div>

<div class="tablet"><div class="screen">

  <div class="bar">
    <span class="brand">ABC<span> POS</span></span>
    <div class="mode">
      <button id="mR" class="on" onclick="setMode('RESTAURANT')"><i class="fa-solid fa-utensils"></i> Restaurant</button>
      <button id="mG" onclick="setMode('GROCERY')"><i class="fa-solid fa-basket-shopping"></i> Mart</button>
    </div>
    <span class="sp"></span>
    <span class="qbadge" id="qb" style="display:none"><i class="fa-solid fa-clock-rotate-left"></i> <span id="qn">0</span></span>
    <button class="net" id="net" onclick="toggleNet()"><i class="dot"></i><span id="netT">ONLINE</span></button>
    <button class="iconbtn" onclick="openDrawer()" title="Today's orders"><i class="fa-solid fa-receipt"></i></button>
  </div>

  <div class="body">
    <div class="left">
      <div class="tools">
        <div class="srch">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="q" placeholder="Search products by name…   ( / )" autocomplete="off" oninput="onSearch()">
          <button class="clr" id="clr" onclick="clearSearch()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="scan" id="scanBox">
          <i class="fa-solid fa-barcode"></i>
          <input id="bc" placeholder="Scan barcode" autocomplete="off">
        </div>
      </div>

      <div class="cats" id="cats"></div>
      <div class="tiles" id="tiles"></div>
    </div>

    <div class="cart">
      <div class="chead">
        <div class="seg" id="types">
          <button class="on" onclick="setType('DINE-IN',this)">DINE-IN</button>
          <button onclick="setType('TAKEAWAY',this)">TAKEAWAY</button>
          <button onclick="setType('DELIVERY',this)">DELIVERY</button>
        </div>
        <div class="tbls" id="tbls"></div>
      </div>

      <div class="lines" id="lines"></div>

      <div class="sums">
        <div class="sr"><span>Subtotal</span><span class="fig" id="sub">AED 0.00</span></div>
        <div class="drow">
          <span>Discount</span>
          <input type="range" id="disc" min="0" max="30" step="5" value="0" oninput="render()">
          <span class="fig" id="discL" style="width:30px;text-align:right">0%</span>
        </div>
        <div class="sr"><span>VAT 5%</span><span class="fig" id="vat">AED 0.00</span></div>
        <div class="sr tot"><span>Total</span><span class="fig" id="tot">AED 0.00</span></div>
      </div>

      <button class="charge" id="charge" disabled onclick="openPay()">
        <i class="fa-solid fa-credit-card"></i><span id="chT">Charge</span>
      </button>
    </div>
  </div>

  <!-- weigh -->
  <div class="veil" id="wVeil">
    <div class="modal">
      <h3 id="wName">Weigh item</h3>
      <p style="font-size:11.5px;color:var(--muted);margin-top:2px" id="wRate"></p>
      <div class="fld">
        <label for="wKg">Weight from scale (kg)</label>
        <input id="wKg" type="number" step="0.001" min="0" placeholder="0.000" oninput="wCalc()">
      </div>
      <div class="quick">
        <button onclick="setKg(.25)">0.25</button><button onclick="setKg(.5)">0.5</button>
        <button onclick="setKg(1)">1.0</button><button onclick="setKg(2)">2.0</button>
      </div>
      <p class="fig" id="wTot" style="margin-top:11px;font-size:15px;font-weight:700;color:var(--teal)">AED 0.00</p>
      <div class="acts">
        <button class="gh" onclick="close_('wVeil')">Cancel</button>
        <button class="go" id="wAdd" onclick="addWeighed()" disabled>Add</button>
      </div>
    </div>
  </div>

  <!-- pay -->
  <div class="veil" id="pVeil">
    <div class="modal">
      <h3>Take payment</h3>
      <div class="big fig" id="pAmt">AED 0.00</div>
      <div class="seg">
        <button id="pmC" class="on" onclick="setPay('CASH')">CASH</button>
        <button id="pmK" onclick="setPay('CARD')">CARD</button>
      </div>
      <div id="cashA">
        <div class="fld">
          <label for="tend">Amount received</label>
          <input id="tend" type="number" step="0.01" placeholder="0.00" oninput="pCalc()">
        </div>
        <div class="quick" id="quick"></div>
        <p class="fig" id="chg" style="margin-top:10px;font-size:13px;font-weight:700;color:var(--teal);display:none"></p>
      </div>
      <div class="acts">
        <button class="gh" onclick="close_('pVeil')">Cancel</button>
        <button class="go" id="pGo" onclick="complete()" disabled>Complete</button>
      </div>
    </div>
  </div>

  <!-- receipt -->
  <div class="veil" id="rVeil">
    <div style="display:flex;flex-direction:column;align-items:center;gap:11px;max-height:94%;overflow:auto">
      <div class="receipt" id="rc"></div>
      <div style="display:flex;gap:7px">
        <button class="gh" style="border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:800;padding:9px 16px;border-radius:9px" onclick="close_('rVeil')">Close</button>
        <button class="amb" style="border:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:800;padding:9px 16px;border-radius:9px" onclick="printRc()"><i class="fa-solid fa-print"></i> Print</button>
      </div>
    </div>
  </div>

  <!-- orders -->
  <div class="drawer" id="drawer">
    <div class="dhead">
      <h3>Today's orders</h3>
      <button class="iconbtn" style="background:var(--line);color:var(--ink)" onclick="closeDrawer()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="dbody" id="dbody"></div>
  </div>

  <div class="toast" id="toast"></div>
</div></div>

<div class="caption">
  TAP THE ONLINE CHIP TO SIMULATE INTERNET LOSS · SEARCH <span class="kbd">naan</span> · SCAN <span class="kbd">6291001</span>
  &nbsp;·&nbsp; <a href="../../">Back to ABC POS</a>
</div>

<script>
/* ====================== catalog ====================== */
const MENU = {

    Starters:[{id:101,n:'Chicken Samosa',s:'4 pieces',p:12},{id:102,n:'Veg Pakora',p:10},
              {id:103,n:'Hummus & Bread',p:14},{id:104,n:'Dynamite Shrimp',p:28}],
    Grills:[{id:201,n:'Chicken Tikka',p:32},{id:202,n:'Seekh Kebab',p:30},
            {id:203,n:'Mixed Grill Platter',p:68},{id:204,n:'Lamb Chops',p:58}],
    Curries:[{id:301,n:'Butter Chicken',p:36},{id:302,n:'Karahi Chicken',s:'Half',p:42},
             {id:303,n:'Daal Makhani',p:24},{id:304,n:'Palak Paneer',p:26}],
    Breads:[{id:401,n:'Butter Naan',p:5},{id:402,n:'Garlic Naan',p:6},
            {id:403,n:'Tandoori Roti',p:3},{id:404,n:'Cheese Naan',p:9}],
    Drinks:[{id:501,n:'Karak Chai',p:4},{id:502,n:'Fresh Lime Mint',p:12},
            {id:503,n:'Mango Lassi',p:14},{id:504,n:'Water 500ml',p:2}],
    Sweets:[{id:601,n:'Gulab Jamun',s:'2 pieces',p:10},{id:602,n:'Kunafa Slice',p:18}],
  }},
  GROCERY:{ name:'DAILY MART', outlet:'Al Nakheel Branch · Ras Al Khaimah', groups:{
    Produce:[{id:1101,n:'Bananas',b:'2000011',p:6.5,w:1,u:'kg',st:42.5},
             {id:1102,n:'Tomatoes',b:'2000012',p:8,w:1,u:'kg',st:28},
             {id:1103,n:'Cucumber',b:'2000013',p:5.5,w:1,u:'kg',st:16.4},
             {id:1104,n:'Red Onion',b:'2000014',p:4.75,w:1,u:'kg',st:61.2}],
    Dairy:[{id:1201,n:'Al Ain Milk 1L',b:'6291001',p:7.25,st:48},
           {id:1202,n:'Laban 1L',b:'6291002',p:6,st:31},
           {id:1203,n:'Greek Yoghurt 500g',b:'6291003',p:12.5,st:7},
           {id:1204,n:'Halloumi 250g',b:'6291004',p:18.75,st:0}],
    Bakery:[{id:1301,n:'Arabic Bread 5pc',b:'6291101',p:3.5,st:64},
            {id:1302,n:'Croissant',b:'6291102',p:4.25,st:22},
            {id:1303,n:'Brown Loaf',b:'6291103',p:9,st:11}],
    Pantry:[{id:1401,n:'Basmati Rice 5kg',b:'6291201',p:38,st:19},
            {id:1402,n:'Sunflower Oil 1.8L',b:'6291202',p:21.5,st:26},
            {id:1403,n:'Lentils 1kg',b:'6291203',p:9.75,st:5},
            {id:1404,n:'Sugar 2kg',b:'6291204',p:11,st:33}],
    Drinks:[{id:1501,n:'Water 6x1.5L',b:'6291301',p:10.5,st:57},
            {id:1502,n:'Cola 330ml',b:'6291302',p:2.5,st:120},
            {id:1503,n:'Orange Juice 1L',b:'6291303',p:13,st:14}],
    Household:[{id:1601,n:'Dish Soap 750ml',b:'6291401',p:14.25,st:18},
               {id:1602,n:'Kitchen Roll 4pc',b:'6291402',p:16,st:9}],
  }}
};
const CAP={RESTAURANT:{tables:1,types:1,scan:0,stock:0}, GROCERY:{tables:0,types:0,scan:1,stock:1}};
const TABLES=['T1','T2','T3','T4','T5','T6','T7','T8'];
const VAT=.05;

let mode='RESTAURANT', cat=null, query='', cart=[], type='DINE-IN', table='T1';
let online=true, orders=[], seq=0, pay='CASH', wItem=null;

const $=s=>document.querySelector(s);
const money=n=>'AED '+Number(n).toLocaleString('en-AE',{minimumFractionDigits:2,maximumFractionDigits:2});
const cap=()=>CAP[mode];
const allItems=()=>Object.entries(MENU[mode].groups).flatMap(([g,arr])=>arr.map(i=>({...i,g})));

/* ====================== search ======================
   Matches product name first, then barcode, then category —
   so "naan" finds all four breads, and "62910" narrows by code. */
function onSearch(){
  query=$('#q').value.trim();
  $('#clr').classList.toggle('show',!!query);
  render();
}
function clearSearch(){ $('#q').value=''; query=''; $('#clr').classList.remove('show'); render(); }
function matches(){
  const t=query.toLowerCase();
  const score=i=>{
    const n=i.n.toLowerCase();
    if(n.startsWith(t)) return 0;          // best: name starts with the term
    if(n.includes(t))   return 1;
    if(i.b&&i.b.includes(t)) return 2;
    if(i.g.toLowerCase().includes(t)) return 3;
    return 9;
  };
  return allItems().map(i=>({i,s:score(i)})).filter(x=>x.s<9)
                   .sort((a,b)=>a.s-b.s).map(x=>x.i);
}
function hl(name){
  if(!query) return name;
  const i=name.toLowerCase().indexOf(query.toLowerCase());
  if(i<0) return name;
  return name.slice(0,i)+'<mark>'+name.slice(i,i+query.length)+'</mark>'+name.slice(i+query.length);
}

/* ====================== mode ====================== */
function setMode(m){
  mode=m; cart=[]; cat=Object.keys(MENU[m].groups)[0];
  $('#q').value=''; query=''; $('#clr').classList.remove('show');
  $('#mR').classList.toggle('on',m==='RESTAURANT');
  $('#mG').classList.toggle('on',m==='GROCERY');
  $('#scanBox').style.display=cap().scan?'block':'none';
  $('#types').style.display=cap().types?'flex':'none';
  $('#q').placeholder = cap().scan ? 'Search products by name…   ( / )' : 'Search the menu…   ( / )';
  render();
}
function setType(t,el){
  type=t; document.querySelectorAll('#types button').forEach(b=>b.classList.remove('on')); el.classList.add('on');
  render();
}

/* ====================== render ====================== */
function stk(i){
  if(!cap().stock||i.st===undefined) return '';
  if(i.st<=0) return '<span class="stk out">OUT</span>';
  if(i.st<=10) return `<span class="stk low">${i.st}</span>`;
  return `<span class="stk ok">${i.st}</span>`;
}
function render(){
  const gs=Object.keys(MENU[mode].groups);
  $('#cats').style.display=query?'none':'flex';
  $('#cats').innerHTML=gs.map(g=>`<button class="cat ${g===cat?'on':''}" onclick="cat='${g}';render()">${g}</button>`).join('');

  const list = query ? matches() : (MENU[mode].groups[cat]||[]).map(i=>({...i,g:cat}));
  $('#tiles').innerHTML = list.length ? list.map(i=>{
    const out=cap().stock&&i.st!==undefined&&i.st<=0;
    return `<button class="tile ${out?'out':''}" ${out?'disabled':''} onclick="pick(${i.id})">
      ${stk(i)}
      <div>
        <div class="n">${hl(i.n)}</div>
        ${query?`<div class="sub">${i.g}</div>`:(i.s?`<div class="sub">${i.s}</div>`:'')}
        ${i.b?`<div class="sub" style="font-family:'IBM Plex Mono',monospace">${i.b}</div>`:''}
      </div>
      <div class="p">${money(i.p)}${i.w?'<small> /kg</small>':''}</div>
      ${i.w?'<i class="fa-solid fa-scale-balanced scale"></i>':''}
    </button>`;
  }).join('') : `<div class="none"><i class="fa-regular fa-face-frown"></i><p>Nothing matches “${query}”</p></div>`;

  $('#lines').innerHTML = cart.length ? cart.map((l,x)=>`
    <div class="line">
      <div class="nm"><b>${l.n}</b><span>${l.w?l.q.toFixed(3)+' kg × '+money(l.p):money(l.p)}</span></div>
      ${l.w?'':`<div class="q">
        <button class="m" onclick="chg(${x},-1)"><i class="fa-solid fa-minus"></i></button>
        <span>${l.q}</span>
        <button class="p" onclick="chg(${x},1)"><i class="fa-solid fa-plus"></i></button></div>`}
      <div class="lt">${money(l.p*l.q)}</div>
      ${l.w?`<button class="q m" style="width:23px;height:23px;border-radius:7px" onclick="cart.splice(${x},1);render()"><i class="fa-solid fa-xmark"></i></button>`:''}
    </div>`).join('')
    : `<div class="empty"><i class="fa-regular fa-${cap().scan?'hand-point-up':'hand-pointer'}"></i><p>${cap().scan?'Scan, search or tap a product':'Tap items to start an order'}</p></div>`;

  const s=sums();
  $('#sub').textContent=money(s.sub); $('#vat').textContent=money(s.vat); $('#tot').textContent=money(s.tot);
  $('#discL').textContent=$('#disc').value+'%';
  $('#charge').disabled=!cart.length;
  $('#chT').textContent=cart.length?'Charge '+money(s.tot):'Charge';
  $('#tbls').innerHTML=TABLES.map(t=>`<button class="${t===table?'on':''}" onclick="table='${t}';render()">${t}</button>`).join('');
  $('#tbls').style.display=(cap().tables&&type==='DINE-IN')?'flex':'none';
  const p=orders.filter(o=>o.st==='PENDING').length;
  $('#qb').style.display=p?'flex':'none'; $('#qn').textContent=p;
}

/* ====================== cart ====================== */
function pick(id){
  const i=allItems().find(x=>x.id===id); if(!i) return;
  if(i.w){ openWeigh(i); return; }
  add(i,1); if(query) toast(i.n+' added');
}
function add(i,q){
  const f=cart.find(l=>l.id===i.id&&!l.w);
  if(f&&!i.w) f.q+=q; else cart.push({id:i.id,n:i.n,p:i.p,q,w:i.w,u:i.u});
  render();
}
function chg(x,d){ const l=cart[x]; l.q=Math.round((l.q+d)*1000)/1000; if(l.q<=0)cart.splice(x,1); render(); }
function sums(){
  const sub=cart.reduce((a,l)=>a+l.p*l.q,0), pc=+$('#disc').value, d=sub*pc/100, v=(sub-d)*VAT;
  return {sub,pc,d,vat:v,tot:sub-d+v};
}

/* ====================== weighed ====================== */
function openWeigh(i){
  wItem=i; $('#wName').textContent=i.n;
  $('#wRate').textContent=money(i.p)+' per kg'+(i.st!==undefined?` · ${i.st} kg in stock`:'');
  $('#wKg').value=''; $('#wTot').textContent=money(0); $('#wAdd').disabled=true;
  $('#wVeil').classList.add('open'); setTimeout(()=>$('#wKg').focus(),50);
}
function setKg(k){ $('#wKg').value=k.toFixed(3); wCalc(); }
function wCalc(){ const k=parseFloat($('#wKg').value)||0; $('#wTot').textContent=money(k*wItem.p); $('#wAdd').disabled=k<=0; }
function addWeighed(){
  const k=parseFloat($('#wKg').value)||0; if(k<=0)return;
  add(wItem,k); close_('wVeil'); toast(`${wItem.n} — ${k.toFixed(3)} kg`);
}

/* ====================== barcode ====================== */
$('#bc').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const c=e.target.value.trim(); e.target.value=''; if(!c)return;
  const i=allItems().find(x=>x.b===c);
  if(!i){ toast('No product with barcode '+c); return; }
  if(cap().stock&&i.st<=0){ toast(i.n+' is out of stock'); return; }
  if(i.w){ openWeigh(i); return; }
  add(i,1); toast(i.n+' added');
});

/* ====================== network ====================== */
function toggleNet(){
  online=!online;
  $('#net').classList.toggle('off',!online); $('#netT').textContent=online?'ONLINE':'OFFLINE';
  if(online) drain(); else toast('Offline — sales will queue on this device');
}
function drain(){
  const p=orders.filter(o=>o.st==='PENDING'); if(!p.length)return;
  let i=0;
  const t=setInterval(()=>{
    if(i>=p.length||!online){ clearInterval(t); if(i) toast(i+' order'+(i>1?'s':'')+' synced'); render(); dRender(); return; }
    p[i].st='SYNCED'; i++; render(); dRender();
  },520);
}

/* ====================== payment ====================== */
function openPay(){
  pay='CASH'; setPay('CASH'); $('#tend').value=''; $('#chg').style.display='none'; $('#pGo').disabled=true;
  const s=sums(); $('#pAmt').textContent=money(s.tot);
  $('#quick').innerHTML=[...new Set([Math.ceil(s.tot/10)*10,Math.ceil(s.tot/50)*50,Math.ceil(s.tot/100)*100])]
    .map(v=>`<button onclick="document.querySelector('#tend').value=${v};pCalc()">${v}</button>`).join('');
  $('#pVeil').classList.add('open'); setTimeout(()=>$('#tend').focus(),50);
}
function setPay(m){
  pay=m; $('#pmC').classList.toggle('on',m==='CASH'); $('#pmK').classList.toggle('on',m==='CARD');
  $('#cashA').style.display=m==='CASH'?'block':'none';
  $('#pGo').disabled = m==='CASH' ? (parseFloat($('#tend').value)||0)<sums().tot : false;
}
function pCalc(){
  const s=sums(), t=parseFloat($('#tend').value)||0, ok=t>=s.tot;
  $('#pGo').disabled=!ok; $('#chg').style.display=ok?'block':'none';
  if(ok)$('#chg').textContent='Change due '+money(t-s.tot);
}
function complete(){
  const s=sums(), t=pay==='CASH'?(parseFloat($('#tend').value)||0):s.tot;
  const o={no:String(++seq).padStart(4,'0'),mode,
    type:cap().types?type:'COUNTER', table:(cap().tables&&type==='DINE-IN')?table:null,
    lines:cart.map(l=>({...l})), ...s, pay, tend:t, chg:t-s.tot,
    st:online?'SYNCED':'PENDING', time:new Date().toLocaleTimeString('en-AE',{hour:'2-digit',minute:'2-digit'})};
  orders.unshift(o); cart=[]; $('#disc').value=0;
  close_('pVeil'); render(); dRender(); showRc(o);
  if(!online) toast('Saved on device — will sync when back online');
}

/* ====================== receipt ====================== */
function showRc(o){
  const b=MENU[o.mode];
  $('#rc').innerHTML=`
    <div class="c b">${b.name}</div>
    <div class="c mu">${b.outlet}</div>
    <div class="c mu">TRN 100234567800003</div>
    <div class="hr"></div>
    <div class="r"><span>#${o.no}</span><span>${o.type}${o.table?' · '+o.table:''}</span></div>
    <div class="r mu"><span>${o.time}</span><span>${o.st}</span></div>
    <div class="hr"></div>
    ${o.lines.map(l=>`<div class="r"><span>${l.w?l.q.toFixed(3)+'kg':l.q+' ×'} ${l.n}</span><span>${(l.p*l.q).toFixed(2)}</span></div>`).join('')}
    <div class="hr"></div>
    <div class="r"><span>Subtotal</span><span>${o.sub.toFixed(2)}</span></div>
    ${o.d>0?`<div class="r"><span>Discount ${o.pc}%</span><span>-${o.d.toFixed(2)}</span></div>`:''}
    <div class="r"><span>VAT 5%</span><span>${o.vat.toFixed(2)}</span></div>
    <div class="r" style="font-weight:600;font-size:12px"><span>TOTAL</span><span>${o.tot.toFixed(2)}</span></div>
    <div class="hr"></div>
    <div class="r"><span>${o.pay}</span><span>${o.tend.toFixed(2)}</span></div>
    ${o.pay==='CASH'?`<div class="r"><span>Change</span><span>${o.chg.toFixed(2)}</span></div>`:''}
    <div class="qr"></div>
    <div class="c mu" style="margin-top:6px">Shukran — please visit again</div>`;
  $('#rVeil').classList.add('open');
}
function printRc(){ close_('rVeil'); toast('Sent to the thermal printer'); }

/* ====================== drawer + misc ====================== */
function openDrawer(){ dRender(); $('#drawer').classList.add('open'); }
function closeDrawer(){ $('#drawer').classList.remove('open'); }
function dRender(){
  if(!orders.length){ $('#dbody').innerHTML='<div class="empty"><i class="fa-regular fa-receipt"></i><p>No sales yet today</p></div>'; return; }
  const tk=orders.reduce((a,o)=>a+o.tot,0);
  $('#dbody').innerHTML=`<div style="display:flex;gap:16px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:9px">
      <div><div style="font-size:9.5px;color:var(--muted);font-weight:700">TAKEN</div><div class="fig" style="font-size:15px;font-weight:800">${money(tk)}</div></div>
      <div><div style="font-size:9.5px;color:var(--muted);font-weight:700">SALES</div><div class="fig" style="font-size:15px;font-weight:800">${orders.length}</div></div>
    </div>`+
    orders.map(o=>`<div class="oc"><b>#${o.no}</b>
      <span class="mt">${o.type}${o.table?' · '+o.table:''} · ${o.pay} · ${o.time}</span>
      <span class="fig" style="font-size:11.5px;font-weight:700">${money(o.tot)}</span>
      <span class="tag ${o.st==='SYNCED'?'s':'p'}">${o.st}</span></div>`).join('');
}
function close_(id){ document.querySelector('#'+id).classList.remove('open'); }
document.querySelectorAll('.veil').forEach(v=>v.addEventListener('click',e=>{ if(e.target===v)v.classList.remove('open'); }));

let tT;
function toast(m){ const el=$('#toast'); el.textContent=m; el.classList.add('show'); clearTimeout(tT); tT=setTimeout(()=>el.classList.remove('show'),2400); }

addEventListener('keydown',e=>{
  if(e.key==='/' && document.activeElement.tagName!=='INPUT'){ e.preventDefault(); $('#q').focus(); }
  if(e.key==='Escape'){ document.querySelectorAll('.veil').forEach(v=>v.classList.remove('open')); closeDrawer(); if(query) clearSearch(); }
});

setMode('RESTAURANT');
</script>
</body>
</html>
