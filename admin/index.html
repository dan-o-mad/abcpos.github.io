<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABC POS — Platform Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141B2D; --ink-2:#1C2540; --edge:#2B3558; --teal:#0E7C6B;
  --amber:#F2A93B; --grey:#8A93AC; --dim:#5B6478; --ok:#4CC9A8; --bad:#F27B6E;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Sora',system-ui,sans-serif; background:var(--ink); color:#fff; line-height:1.6}

.bar{padding:12px 20px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--edge); flex-wrap:wrap}
.mark{font-weight:800; font-size:16px}
.mark span{color:var(--amber)}
.bar .ctx{font-size:12px; color:var(--grey)}
.bar .sp{flex:1}
.pill{
  font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; letter-spacing:.12em;
  background:rgba(242,169,59,.16); color:var(--amber); border:1px solid rgba(242,169,59,.4);
  padding:4px 9px; border-radius:20px;
}
.back{font-size:12px; color:var(--grey); text-decoration:none}
.back:hover{color:#fff}

.wrap{max-width:900px; margin:0 auto; padding:22px 16px 60px}
.card{background:var(--ink-2); border:1px solid var(--edge); border-radius:14px; padding:18px; margin-bottom:14px}
.card h2{font-size:11px; font-weight:700; letter-spacing:.14em; color:var(--grey); text-transform:uppercase; margin-bottom:14px}

.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:11px}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:11px; color:var(--dim); font-weight:600}
input,select{
  font-family:'Sora',sans-serif; font-size:13.5px; color:#fff; background:var(--ink);
  border:1px solid var(--edge); border-radius:9px; padding:10px 11px; width:100%;
}
input::placeholder{color:var(--dim)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--amber); outline-offset:1px}

button{
  font-family:'Sora',sans-serif; font-weight:700; font-size:13.5px; color:#fff;
  background:var(--teal); border:none; border-radius:10px; padding:11px 22px;
  cursor:pointer; margin-top:14px;
}
button:hover{background:#0C6C5D}
button.ghost{background:transparent; border:1px solid var(--edge); color:var(--grey); padding:6px 13px; font-size:11.5px; margin:0}
button.ghost:hover{color:#fff; border-color:var(--grey)}

.msg{margin-top:12px; font-size:13px; font-weight:600; min-height:20px}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}

table{width:100%; border-collapse:collapse}
th{
  text-align:left; font-size:10px; font-weight:700; letter-spacing:.1em; color:var(--dim);
  text-transform:uppercase; padding:7px 8px; border-bottom:1px solid var(--edge);
}
td{padding:10px 8px; border-bottom:1px solid #232C48; font-size:13px; vertical-align:middle}
tr:last-child td{border-bottom:none}
.code{font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600}
.tag{
  display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600;
  letter-spacing:.08em; padding:3px 8px; border-radius:12px; background:#2B3558; color:#C7CEE4;
}
.tag.fuel{background:rgba(242,169,59,.16); color:var(--amber)}
.tag.grocery{background:rgba(14,124,107,.2); color:var(--ok)}
.new td{animation:in .5s ease}
@keyframes in{from{background:rgba(76,201,168,.14)}to{background:transparent}}
.hint{font-size:12px; color:var(--dim); margin-top:12px; line-height:1.7}
.seat{display:flex; align-items:center; gap:10px}
h2 .cnt{color:var(--grey); font-weight:600; letter-spacing:0; text-transform:none; font-size:11px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<div class="bar">
  <span class="mark">ABC<span> POS</span></span>
  <span class="ctx">Platform admin</span>
  <span class="sp"></span>
  <span class="pill">DEMO DATA</span>
  <a class="back" href="../">← Demo menu</a>
</div>

<div class="wrap">

  <section class="card">
    <h2>Add a business</h2>
    <div class="grid">
      <div class="field"><label for="code">Business code</label>
        <input id="code" placeholder="ALNOOR01"></div>
      <div class="field"><label for="name">Business name</label>
        <input id="name" placeholder="Al Noor Restaurant"></div>
      <div class="field"><label for="vert">What do they sell</label>
        <select id="vert">
          <option value="RESTAURANT">Restaurant</option>
          <option value="GROCERY">Grocery / mart</option>
          <option value="FUEL">Petrol station</option>
        </select></div>
      <div class="field"><label for="vat">VAT rate %</label>
        <input id="vat" type="number" value="5" min="0" max="20"></div>
      <div class="field"><label for="plan">Plan</label>
        <select id="plan">
          <option>STARTER</option><option selected>GROWTH</option><option>PRO</option>
        </select></div>
      <div class="field"><label for="owner">Owner sign-in name</label>
        <input id="owner" placeholder="hamad"></div>
    </div>
    <button id="go">Create business</button>
    <div class="msg" id="msg"></div>
    <p class="hint">One step sets up their outlet, the owner's sign-in, a full chart of accounts and a default receipt. Hand them the business code and they can start loading their menu.</p>
  </section>

  <section class="card">
    <h2><span class="seat">Businesses on the platform <span class="cnt" id="cnt"></span>
      <button class="ghost" id="reset" style="margin-left:auto">Reset demo</button></span></h2>
    <table>
      <thead><tr><th>Code</th><th>Name</th><th>Sells</th><th>Plan</th><th class="code">Added</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

</div>

<script>
/* =====================================================================
   CONFIG — flip to live when the API is deployed (Track B)
   In 'live' mode, provisioning POSTs to API_BASE/api/admin/tenants with
   either an X-Bootstrap-Key header or a SUPERADMIN bearer token.
   ===================================================================== */
const CONFIG = { MODE:'demo', API_BASE:'https://api.bytecraft.live' };

const SEED = [
  { code:'ALNOOR01', name:'Al Noor Restaurant',    vert:'RESTAURANT', plan:'GROWTH',  added:'2026-05-04' },
  { code:'EMPETRO1', name:'Emirates Petro Stn 4',  vert:'FUEL',       plan:'PRO',     added:'2026-06-11' },
  { code:'DAILYMRT', name:'Daily Mart Al Nakheel', vert:'GROCERY',    plan:'STARTER', added:'2026-07-02' },
];

let tenants = SEED.slice();
const $ = id => document.getElementById(id);

function label(v){
  return v==='RESTAURANT' ? 'Restaurant' : v==='GROCERY' ? 'Grocery / mart' : 'Petrol station';
}

function render(isNewFirst){
  $('rows').innerHTML = tenants.map((t,i)=>`
    <tr class="${isNewFirst && i===0 ? 'new' : ''}">
      <td class="code">${t.code}</td>
      <td>${t.name}</td>
      <td><span class="tag ${t.vert.toLowerCase()}">${label(t.vert)}</span></td>
      <td>${t.plan}</td>
      <td class="code" style="color:var(--dim)">${t.added}</td>
    </tr>`).join('');
  $('cnt').textContent = '· ' + tenants.length + ' active';
}

function create(){
  const code  = $('code').value.trim().toUpperCase();
  const name  = $('name').value.trim();
  const owner = $('owner').value.trim();
  const msg   = $('msg');

  // Real validation — an empty form should tell you what to fix, not fail silently.
  if(!code || !name || !owner){
    msg.className='msg bad';
    msg.textContent='Fill in the business code, name and owner sign-in name.';
    return;
  }
  if(tenants.some(t=>t.code===code)){
    msg.className='msg bad';
    msg.textContent=`${code} is already taken. Pick another business code.`;
    return;
  }

  tenants.unshift({
    code, name, vert:$('vert').value, plan:$('plan').value,
    added:new Date().toISOString().slice(0,10)
  });
  render(true);

  msg.className='msg ok';
  msg.textContent=`${name} is set up. ${owner} can sign in with business code ${code}.`;
  ['code','name','owner'].forEach(id=>$(id).value='');
}

$('go').addEventListener('click', create);
$('reset').addEventListener('click', ()=>{
  tenants = SEED.slice(); render(false);
  $('msg').textContent=''; $('msg').className='msg';
});
render(false);
</script>
</body>
</html>
